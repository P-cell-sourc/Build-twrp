name: TWRP 16 Build

# 复刻自 P-cell-sourc/RO_Twrp (OrangeFox Builder for PD2415)，
# 专门针对 TWRP 官方最新 twrp-16.0 分支 (TWRP-Test/platform_manifest_twrp_aosp)：
#   - 去掉 OrangeFox 专属机制 (pinned manifest + patches + fox_env + 空壳 zip 过滤)
#   - 保留：swap、容量自检、ccache、同步失败自愈重试、boot 镜像地址静态校验、
#           逐目标构建日志、失败自动诊断、产物校验收集、独立发布 job
#   - 默认设备：vivo PD2415 (iQOO Z11)，设备树 P-cell-sourc/twrp_device_vivo_PD2415_twrp

on:
  workflow_dispatch:
    inputs:
      MANIFEST_URL:
        description: 'TWRP manifest 仓库 (官方 twrp-16.0)'
        required: true
        default: 'https://github.com/TWRP-Test/platform_manifest_twrp_aosp'
      MANIFEST_BRANCH:
        description: 'TWRP 源码分支'
        required: true
        default: 'twrp-16.0'
        type: choice
        options:
          - 'twrp-16.0'
          - 'twrp-14'
          - 'twrp-12.1'
      DEVICE_TREE_URL:
        description: 'DEVICE_TREE_URL'
        required: true
        default: 'https://github.com/P-cell-sourc/twrp_device_vivo_PD2415_twrp'
      DEVICE_TREE_BRANCH:
        description: 'DEVICE_TREE_BRANCH'
        required: true
        default: 'main'
      DEVICE_PATH:
        description: 'DEVICE_PATH (源码树内位置, device/ 相对路径)'
        required: true
        default: 'device/vivo/PD2415'
      COMMON_TREE_URL:
        description: 'COMMON_TREE_URL (无 common tree 留空)'
        required: false
      COMMON_PATH:
        description: 'COMMON_PATH (无 common tree 留空)'
        required: false
      DEVICE_NAME:
        description: 'DEVICE_NAME (out/target/product/<name>)'
        required: true
        default: 'PD2415'
      MAKEFILE_NAME:
        description: 'MAKEFILE_NAME (直接填产品名, 勿加 -eng 后缀)'
        required: true
        default: 'twrp_PD2415'
      BUILD_TARGET:
        description: 'BUILD_TARGET (make 目标, 空格分隔: recoveryimage / vendorbootimage / bootimage)'
        required: true
        default: 'recoveryimage'
      PUBLISH:
        description: '构建成功后创建 GitHub Release'
        required: false
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: twrp-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TWRP_TOP: ${{ github.workspace }}/TWRP
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: '5G'
  CCACHE_CACHE_VERSION: '1'
  MIN_SWAP_GIB: '12'
  # twrp-16.0 源码 + out 峰值约需 65 GiB, 另留 3 GiB 编译缓存。
  REQUIRED_DISK_GIB: '75'
  # 删除 .repo 后仍要为 Soong 写入 out/ 保底。
  REQUIRED_COMPILE_DISK_GIB: '35'
  REQUIRED_MEMORY_GIB: '14'

jobs:
  build:
    if: github.event.repository.owner.id == github.event.sender.id
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Display Run Parameters
        run: |
          echo "::group::User Environment Variables"
          echo "Manifest URL: ${{ github.event.inputs.MANIFEST_URL }}"
          echo "Manifest branch: ${{ github.event.inputs.MANIFEST_BRANCH }}"
          echo "Device Tree URL: ${{ github.event.inputs.DEVICE_TREE_URL }}"
          echo "Device Tree Branch: ${{ github.event.inputs.DEVICE_TREE_BRANCH }}"
          echo "Device Path: ${{ github.event.inputs.DEVICE_PATH }}"
          echo "Device Name: ${{ github.event.inputs.DEVICE_NAME }}"
          echo "Makefile Name: ${{ github.event.inputs.MAKEFILE_NAME }}"
          echo "Build Target: ${{ github.event.inputs.BUILD_TARGET }}"
          echo "Publish: ${{ github.event.inputs.PUBLISH }}"
          echo "::endgroup::"

      - name: Check Out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          path: builder

      # 清理镜像自带的无关负载, 比单纯 apt clean 释放更多空间。
      - name: Free disk space
        uses: rokibhasansagar/slimhub_actions@main

      - name: Install host packages
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            bc bison build-essential ccache cpio curl device-tree-compiler flex g++-multilib \
            gcc-multilib git git-lfs gnupg gperf imagemagick \
            lib32ncurses-dev lib32readline-dev lib32z1-dev libelf-dev \
            liblz4-tool libncurses-dev libssl-dev libxml2 \
            libxml2-utils lz4 pngcrush python-is-python3 python3 ripgrep rsync schedtool squashfs-tools \
            unzip xsltproc zip zlib1g-dev
          sudo apt-get clean

      - name: Fetch device tree
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 \
            ${{ github.event.inputs.DEVICE_TREE_URL }} \
            -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} \
            "$GITHUB_WORKSPACE/device-tree"
          # LFS 指针文件会让后续的 blob 校验通过但内容为空, 必须落地实体文件。
          if git -C "$GITHUB_WORKSPACE/device-tree" config --get-regexp '^filter\.lfs' >/dev/null 2>&1; then
            git -C "$GITHUB_WORKSPACE/device-tree" lfs pull
          fi

      - name: Report source versions
        shell: bash
        run: |
          set -euo pipefail
          echo "::group::实际使用的代码版本"
          echo -n "builder   : "
          git -C "$GITHUB_WORKSPACE/builder" rev-parse HEAD
          git -C "$GITHUB_WORKSPACE/builder" --no-pager log -1 --format='   %ci  %s'
          echo -n "device    : "
          git -C "$GITHUB_WORKSPACE/device-tree" rev-parse HEAD
          git -C "$GITHUB_WORKSPACE/device-tree" --no-pager log -1 --format='   %ci  %s'
          echo "::endgroup::"

          # 设备树关键文件自检: 缺失时在这里就停, 而不是等到编译失败。
          dt="$GITHUB_WORKSPACE/device-tree"
          echo "::group::设备树自检"
          for f in AndroidProducts.mk BoardConfig.mk device.mk recovery.fstab; do
            if [[ ! -f "$dt/$f" ]]; then
              echo "::warning::设备树缺少 $f"
            else
              echo "OK: $f"
            fi
          done
          mkfiles="$(ls "$dt"/twrp_*.mk "$dt"/omni_*.mk 2>/dev/null || true)"
          if [[ -z "$mkfiles" ]]; then
            echo "::error::设备树里找不到 twrp_*.mk / omni_*.mk 产品 makefile"
            exit 1
          fi
          echo "产品 makefile: $(basename "$mkfiles" | tr '\n' ' ')"
          echo "::endgroup::"

      - name: Setup build swap
        shell: bash
        run: |
          set -euo pipefail
          MIN_SWAP_GIB="$MIN_SWAP_GIB" \
            bash "$GITHUB_WORKSPACE/builder/.github/scripts/setup-swap.sh"

      - name: Check runner capacity
        shell: bash
        run: |
          set -euo pipefail
          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')"
          required_kib=$((REQUIRED_DISK_GIB * 1024 * 1024))
          if [[ -z "${available_kib}" || "${available_kib}" -lt "${required_kib}" ]]; then
            echo "::error::需要至少 ${REQUIRED_DISK_GIB} GiB 可用空间 (清理后实测 $((available_kib / 1024 / 1024)) GiB)。"
            exit 1
          fi
          memory_kib="$(awk '/^MemTotal:/ { print $2 }' /proc/meminfo)"
          required_memory_kib=$((REQUIRED_MEMORY_GIB * 1024 * 1024))
          if [[ -z "${memory_kib}" || "${memory_kib}" -lt "${required_memory_kib}" ]]; then
            echo "::error::需要 ${REQUIRED_MEMORY_GIB} GiB 级内存 runner (实测 $((memory_kib / 1024 / 1024)) GiB)。"
            exit 1
          fi
          df -h "$GITHUB_WORKSPACE"
          free -h

      - name: Restore compiler cache
        id: ccache_restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: twrp-ccache-${{ env.CCACHE_CACHE_VERSION }}-${{ runner.os }}-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.event.inputs.DEVICE_NAME }}
          restore-keys: |
            twrp-ccache-${{ env.CCACHE_CACHE_VERSION }}-${{ runner.os }}-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.event.inputs.DEVICE_NAME }}-

      - name: Configure compiler cache
        shell: bash
        run: |
          set -euo pipefail
          command -v ccache
          install -d "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -z
          ccache -p

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail
          install -d "$HOME/bin"
          curl --fail --location --retry 5 --retry-all-errors \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP sources
        timeout-minutes: 75
        shell: bash
        run: |
          set -euo pipefail

          # 修复 "unsupported checkout state": repo 浅克隆 (--depth=1) 同步中途
          # 网络中断后, 个别项目的 .git 会进入 repo 无法自愈的损坏状态, 普通
          # repo sync 重试必然再次撞同一个坏状态。唯一可靠的恢复是删掉该项目
          # 的工作树与 .repo 存储, 让 repo 重新克隆。
          recover_bad_projects() {
            local log="$1"
            [[ -f "$log" ]] || return 0
            local paths
            paths="$(grep -oE 'TWRP/[^ ]+/\.git' "$log" \
                      | sed -E 's#^TWRP/##; s#/\.git$##' | sort -u)"
            if [[ -z "$paths" ]]; then
              paths="$(sed -n '/Failing repos/,/^$/p' "$log" \
                        | grep -vE 'Failing repos|^$' | tr -d ':' | sort -u)"
            fi
            [[ -z "$paths" ]] && return 0
            for p in $paths; do
              echo "  purging bad project: $p"
              rm -rf "$TWRP_TOP/$p"
              rm -rf "$TWRP_TOP/.repo/projects/$p.git"
              rm -rf "$TWRP_TOP/.repo/project-objects/$p.git"
            done
          }

          # twrp-16.0 官方 manifest 开箱即用, 无需 OrangeFox 那套 pinned+补丁。
          export GIT_CONFIG_GLOBAL="$GITHUB_WORKSPACE/ci-gitconfig"
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 600

          mkdir -p "$TWRP_TOP"
          cd "$TWRP_TOP"
          repo init --depth=1 \
            -u ${{ github.event.inputs.MANIFEST_URL }} \
            -b ${{ github.event.inputs.MANIFEST_BRANCH }}

          (
            while sleep 60; do
              date -u '+%Y-%m-%dT%H:%M:%SZ sync heartbeat'
              df -h "$GITHUB_WORKSPACE"
              free -h
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT

          sync_succeeded=0
          for sync_attempt in 1 2 3 4; do
            if repo sync -c -j16 --retry-fetches=3 --no-clone-bundle --no-tags --optimized-fetch \
                 2>&1 | tee /tmp/repo-sync.log; then
              sync_succeeded=1
              break
            fi
            echo "::warning::同步第 ${sync_attempt} 次失败, 清理损坏项目后重试"
            recover_bad_projects /tmp/repo-sync.log
            sleep 5
          done
          if [[ "$sync_succeeded" -ne 1 ]]; then
            echo "::error::源码同步四次均失败。" >&2
            exit 1
          fi

          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT

      - name: Install device tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TWRP_TOP/${{ github.event.inputs.DEVICE_PATH }}"
          rsync -a --delete \
            --exclude .git \
            "$GITHUB_WORKSPACE/device-tree/" \
            "$TWRP_TOP/${{ github.event.inputs.DEVICE_PATH }}/"

          # 兜底补执行位。设备树在 Windows 上开发时 git 默认 core.filemode=false,
          # 脚本可能以 100644 提交, AOSP 构建会直接执行设备树里的 .sh, 缺执行位
          # 在 Linux CI 上直接 Permission denied。
          echo "::group::修正设备树脚本执行位"
          find "$TWRP_TOP/${{ github.event.inputs.DEVICE_PATH }}" \
            -type f -name '*.sh' -print -exec chmod +x {} \; || true
          echo "::endgroup::"

      - name: Clone common tree
        if: ${{ github.event.inputs.COMMON_TREE_URL != '' && github.event.inputs.COMMON_PATH != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 \
            ${{ github.event.inputs.COMMON_TREE_URL }} \
            -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} \
            "$TWRP_TOP/${{ github.event.inputs.COMMON_PATH }}"

      - name: Apply device tree patches
        shell: bash
        working-directory: ${{ env.TWRP_TOP }}
        run: |
          set -euo pipefail
          # 设备树的 apply-patches.sh 必须在源码根目录执行; 无补丁时为空操作。
          script="${{ github.event.inputs.DEVICE_PATH }}/apply-patches.sh"
          if [[ -f "$script" ]]; then
            chmod +x "$script"
            sh "$script"
          fi

      # 必须在编译**之前**跑。偏移溢出只会在 ninja 的最后一个 target 上暴露:
      #     struct.error: 'I' format requires 0 <= number <= 4294967295
      # 而那时前面 18000+ 个 target 已经全部跑完 —— 真实代价是几十分钟白跑。
      # 根因: 镜像 header 里的地址是绝对地址, 而 mkbootimg 的 --*_offset 是
      # 相对 --base 的偏移 (pd2415 的 base 是 0x3fff8000, 照抄绝对地址必炸)。
      - name: Validate boot image offsets
        shell: bash
        run: |
          set -euo pipefail
          configs=()
          for path in "${{ github.event.inputs.DEVICE_PATH }}" \
                       "${{ github.event.inputs.COMMON_PATH }}"; do
            if [[ -z "$path" ]]; then
              continue
            fi
            config="$TWRP_TOP/$path/BoardConfig.mk"
            if [[ -f "$config" ]]; then
              configs+=("$config")
            fi
          done
          if [[ "${#configs[@]}" -eq 0 ]]; then
            echo "::error::未找到任何 BoardConfig.mk, 设备树未正确安装"
            exit 1
          fi
          # 退出码: 0 = 通过; 1 = 偏移溢出 (必然失败, 立刻停);
          #         2 = 用法错误 —— 也当失败处理。
          bash "$GITHUB_WORKSPACE/builder/.github/scripts/check-boot-offsets.sh" "${configs[@]}"

      - name: Sync Device Dependencies
        shell: bash
        working-directory: ${{ env.TWRP_TOP }}
        run: |
          set -euo pipefail
          # 必须在删除 .repo 之前完成; omni_*.dependencies / twrp_*.dependencies 二者取其一。
          for dep in twrp omni; do
            f="${{ github.event.inputs.DEVICE_PATH }}/$dep.dependencies"
            if [[ -f "$f" ]]; then
              bash "$GITHUB_WORKSPACE/builder/scripts/convert.sh" "$f"
              break
            fi
          done
          repo sync -j16

      - name: Drop sync metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TWRP_TOP/.repo" \
            "$GITHUB_WORKSPACE/ci-gitconfig"
          df -h "$GITHUB_WORKSPACE"
          free -h

      - name: Check compilation capacity
        shell: bash
        run: |
          set -euo pipefail
          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')"
          required_kib=$((REQUIRED_COMPILE_DISK_GIB * 1024 * 1024))
          if [[ -z "${available_kib}" || "${available_kib}" -lt "${required_kib}" ]]; then
            echo "::error::删除 .repo 后需要至少 ${REQUIRED_COMPILE_DISK_GIB} GiB (实测 $((available_kib / 1024 / 1024)) GiB)。"
            exit 1
          fi
          du -sh "$TWRP_TOP"
          df -h "$GITHUB_WORKSPACE"

      - name: Building TWRP
        # 关键: 步骤级超时要远小于 job 的 6h 上限。若任由 GitHub 在 360 分钟
        # 平台强杀整个 job, 后面的 ccache 保存步骤不会执行, 缓存永远建立不起来,
        # 每次运行都从零冷编译 => 每次都在第 6 小时被杀 (exit 143) 死循环。
        # 步骤超时是"优雅失败", always() 的保存步骤仍会执行。
        timeout-minutes: 250
        shell: bash
        working-directory: ${{ env.TWRP_TOP }}
        env:
          ALLOW_MISSING_DEPENDENCIES: 'true'
          GOMEMLIMIT: '3GiB'
          GOGC: '20'
          _JAVA_OPTIONS: '-Xmx3g'
          USE_CCACHE: '1'
          CCACHE_EXEC: /usr/bin/ccache
          CCACHE_COMPILERCHECK: content
          CCACHE_COMPRESS: 'true'
        run: |
          set -euo pipefail
          build_jobs="$(nproc)"
          export NINJA_ARGS="-j${build_jobs} -l${build_jobs}"
          printf 'Using %s Ninja jobs\n' "$build_jobs"

          (
            while sleep 60; do
              date -u '+%Y-%m-%dT%H:%M:%SZ build heartbeat'
              df -h "$GITHUB_WORKSPACE"
              free -h
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT

          set +u
          source build/envsetup.sh
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}

          # 逐个目标分别构建, 不用一条 `make A B -j`。
          # 合并构建时并行输出会互相淹没, 定位不到是哪个目标失败; 分开后
          # 每个目标有独立日志, 便于定位失败目标。
          build_target_log="$GITHUB_WORKSPACE/twrp-build.log"
          : > "$build_target_log"

          for target in ${{ github.event.inputs.BUILD_TARGET }}; do
            echo "===== BUILD TARGET: $target =====" | tee -a "$build_target_log"
            if make "$target" -j"$build_jobs" 2>&1 | tee -a "$build_target_log"; then
              echo "===== TARGET OK: $target =====" | tee -a "$build_target_log"
            else
              echo "===== TARGET FAILED: $target =====" | tee -a "$build_target_log"
              echo "::error::构建目标 $target 失败, 详见上方日志中的 TARGET FAILED 段落"
              kill "$heartbeat_pid" 2>/dev/null || true
              trap - EXIT
              exit 1
            fi
          done

          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT

      - name: Verify recovery payload
        shell: bash
        run: |
          set -euo pipefail
          # 本步骤只对会产出 recovery ramdisk 的目标有意义。
          if [[ "${{ github.event.inputs.BUILD_TARGET }}" != *recoveryimage* ]] &&
             [[ "${{ github.event.inputs.BUILD_TARGET }}" != *vendorbootimage* ]]; then
            echo "BUILD_TARGET 不含 recoveryimage / vendorbootimage, 跳过 ramdisk 载荷自检"
            exit 0
          fi

          device_dir="$TWRP_TOP/${{ github.event.inputs.DEVICE_PATH }}"
          product="$TWRP_TOP/out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
          root="$product/recovery/root"

          if [[ ! -d "$root" ]]; then
            echo "::error::未生成 recovery root: $root"
            exit 1
          fi

          echo "::group::ramdisk 载荷自检"

          # prebuilt/recovery_modules 仅部分设备树提供; 没有则跳过模块比对,
          # 只做基础存在性校验。
          essential_list="$device_dir/prebuilt/recovery_modules/essential_modules.txt"
          shopt -s nullglob
          if [[ -f "$essential_list" ]]; then
            prebuilt_modules=()
            while IFS= read -r mod || [[ -n "$mod" ]]; do
              [[ -n "$mod" ]] || continue
              prebuilt_modules+=("$device_dir/prebuilt/recovery_modules/$mod")
            done < "$essential_list"
          else
            prebuilt_modules=("$device_dir"/prebuilt/recovery_modules/*.ko)
          fi
          shopt -u nullglob

          if [[ "${#prebuilt_modules[@]}" -gt 0 ]]; then
            missing=()
            for module in "${prebuilt_modules[@]}"; do
              if [[ ! -f "$root/lib/modules/$(basename "$module")" ]]; then
                missing+=("$(basename "$module")")
              fi
            done
            if [[ "${#missing[@]}" -gt 0 ]]; then
              echo "::error::ramdisk 缺少 ${#missing[@]}/${#prebuilt_modules[@]} 个 essential 模块, 例: ${missing[*]:0:5}"
              exit 1
            fi
            echo "内核模块: ${#prebuilt_modules[@]} 个 essential 模块全部就位"
          else
            echo "设备树未提供 prebuilt/recovery_modules, 跳过逐模块比对"
          fi

          if [[ -f "$root/ramdisk-files.txt" ]]; then
            echo "ramdisk 清单: $(wc -l < "$root/ramdisk-files.txt") 条"
          fi

          # mkbootfs 打不开目录时只打印一行就继续, ninja 视而不见。
          if [[ -f "$GITHUB_WORKSPACE/twrp-build.log" ]] && \
             grep -q 'mkbootfs: cannot open directory' "$GITHUB_WORKSPACE/twrp-build.log"; then
            echo "::warning::mkbootfs 打不开 vendor_ramdisk 目录, 相关镜像可能为空包"
          fi
          echo "::endgroup::"

          # 运行时确认构建产物 header 的绝对地址, 与静态校验互为印证。
          for img in vendor_boot.img recovery.img boot.img; do
            if [[ -f "$product/$img" ]]; then
              unpack="$TWRP_TOP/system/tools/mkbootimg/unpack_bootimg.py"
              if [[ -f "$unpack" ]]; then
                echo "::group::构建产物 $img header"
                python3 "$unpack" \
                  --boot_img "$product/$img" \
                  --out "$GITHUB_WORKSPACE/header-check" || true
                echo "::endgroup::"
              fi
              break
            fi
          done
          - name: Restore compiler cache
        id: ccache_restore
        continue-on-error: true
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: twrp-ccache-${{ env.CCACHE_CACHE_VERSION }}-${{ runner.os }}-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.event.inputs.DEVICE_NAME }}
          restore-keys: |
            twrp-ccache-${{ env.CCACHE_CACHE_VERSION }}-${{ runner.os }}-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.event.inputs.DEVICE_NAME }}-

      - name: Configure compiler cache
        shell: bash
        run: |
          set -euo pipefail
          command -v ccache
          install -d "$CCACHE_DIR"
          ccache -M "$CCACHE_MAXSIZE"
          ccache -z
          ccache -p

      - name: Install repo tool
        shell: bash
        run: |
          set -euo pipefail
          install -d "$HOME/bin"
          curl --fail --location --retry 5 --retry-all-errors \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output "$HOME/bin/repo"
          chmod +x "$HOME/bin/repo"
          echo "$HOME/bin" >> "$GITHUB_PATH"

      - name: Sync TWRP sources
        timeout-minutes: 75
        shell: bash
        run: |
          set -euo pipefail

          # 修复 "unsupported checkout state": repo 浅克隆 (--depth=1) 同步中途
          # 网络中断后, 个别项目的 .git 会进入 repo 无法自愈的损坏状态, 普通
          # repo sync 重试必然再次撞同一个坏状态。唯一可靠的恢复是删掉该项目
          # 的工作树与 .repo 存储, 让 repo 重新克隆。
          recover_bad_projects() {
            local log="$1"
            [[ -f "$log" ]] || return 0
            local paths
            paths="$(grep -oE 'TWRP/[^ ]+/\.git' "$log" \
                      | sed -E 's#^TWRP/##; s#/\.git$##' | sort -u)"
            if [[ -z "$paths" ]]; then
              paths="$(sed -n '/Failing repos/,/^$/p' "$log" \
                        | grep -vE 'Failing repos|^$' | tr -d ':' | sort -u)"
            fi
            [[ -z "$paths" ]] && return 0
            for p in $paths; do
              echo "  purging bad project: $p"
              rm -rf "$TWRP_TOP/$p"
              rm -rf "$TWRP_TOP/.repo/projects/$p.git"
              rm -rf "$TWRP_TOP/.repo/project-objects/$p.git"
            done
          }

          # twrp-16.0 官方 manifest 开箱即用, 无需 OrangeFox 那套 pinned+补丁。
          export GIT_CONFIG_GLOBAL="$GITHUB_WORKSPACE/ci-gitconfig"
          git config --global http.lowSpeedLimit 1
          git config --global http.lowSpeedTime 600

          mkdir -p "$TWRP_TOP"
          cd "$TWRP_TOP"
          repo init --depth=1 \
            -u ${{ github.event.inputs.MANIFEST_URL }} \
            -b ${{ github.event.inputs.MANIFEST_BRANCH }}

          (
            while sleep 60; do
              date -u '+%Y-%m-%dT%H:%M:%SZ sync heartbeat'
              df -h "$GITHUB_WORKSPACE"
              free -h
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT

          sync_succeeded=0
          for sync_attempt in 1 2 3 4; do
            if repo sync -c -j16 --retry-fetches=3 --no-clone-bundle --no-tags --optimized-fetch \
                 2>&1 | tee /tmp/repo-sync.log; then
              sync_succeeded=1
              break
            fi
            echo "::warning::同步第 ${sync_attempt} 次失败, 清理损坏项目后重试"
            recover_bad_projects /tmp/repo-sync.log
            sleep 5
          done
          if [[ "$sync_succeeded" -ne 1 ]]; then
            echo "::error::源码同步四次均失败。" >&2
            exit 1
          fi

          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT

      - name: Install device tree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$TWRP_TOP/${{ github.event.inputs.DEVICE_PATH }}"
          rsync -a --delete \
            --exclude .git \
            "$GITHUB_WORKSPACE/device-tree/" \
            "$TWRP_TOP/${{ github.event.inputs.DEVICE_PATH }}/"

          # 兜底补执行位。设备树在 Windows 上开发时 git 默认 core.filemode=false,
          # 脚本可能以 100644 提交, AOSP 构建会直接执行设备树里的 .sh, 缺执行位
          # 在 Linux CI 上直接 Permission denied。
          echo "::group::修正设备树脚本执行位"
          find "$TWRP_TOP/${{ github.event.inputs.DEVICE_PATH }}" \
            -type f -name '*.sh' -print -exec chmod +x {} \; || true
          echo "::endgroup::"

      - name: Clone common tree
        if: ${{ github.event.inputs.COMMON_TREE_URL != '' && github.event.inputs.COMMON_PATH != '' }}
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth=1 \
            ${{ github.event.inputs.COMMON_TREE_URL }} \
            -b ${{ github.event.inputs.DEVICE_TREE_BRANCH }} \
            "$TWRP_TOP/${{ github.event.inputs.COMMON_PATH }}"

      - name: Apply device tree patches
        shell: bash
        working-directory: ${{ env.TWRP_TOP }}
        run: |
          set -euo pipefail
          # 设备树的 apply-patches.sh 必须在源码根目录执行; 无补丁时为空操作。
          script="${{ github.event.inputs.DEVICE_PATH }}/apply-patches.sh"
          if [[ -f "$script" ]]; then
            chmod +x "$script"
            sh "$script"
          fi

      # 必须在编译**之前**跑。偏移溢出只会在 ninja 的最后一个 target 上暴露:
      #     struct.error: 'I' format requires 0 <= number <= 4294967295
      # 而那时前面 18000+ 个 target 已经全部跑完 —— 真实代价是几十分钟白跑。
      # 根因: 镜像 header 里的地址是绝对地址, 而 mkbootimg 的 --*_offset 是
      # 相对 --base 的偏移 (pd2415 的 base 是 0x3fff8000, 照抄绝对地址必炸)。
      - name: Validate boot image offsets
        shell: bash
        run: |
          set -euo pipefail
          configs=()
          for path in "${{ github.event.inputs.DEVICE_PATH }}" \
                       "${{ github.event.inputs.COMMON_PATH }}"; do
            if [[ -z "$path" ]]; then
              continue
            fi
            config="$TWRP_TOP/$path/BoardConfig.mk"
            if [[ -f "$config" ]]; then
              configs+=("$config")
            fi
          done
          if [[ "${#configs[@]}" -eq 0 ]]; then
            echo "::error::未找到任何 BoardConfig.mk, 设备树未正确安装"
            exit 1
          fi
          # 退出码: 0 = 通过; 1 = 偏移溢出 (必然失败, 立刻停);
          #         2 = 用法错误 —— 也当失败处理。
          bash "$GITHUB_WORKSPACE/builder/.github/scripts/check-boot-offsets.sh" "${configs[@]}"

      - name: Sync Device Dependencies
        shell: bash
        working-directory: ${{ env.TWRP_TOP }}
        run: |
          set -euo pipefail
          # 必须在删除 .repo 之前完成; omni_*.dependencies / twrp_*.dependencies 二者取其一。
          for dep in twrp omni; do
            f="${{ github.event.inputs.DEVICE_PATH }}/$dep.dependencies"
            if [[ -f "$f" ]]; then
              bash "$GITHUB_WORKSPACE/builder/scripts/convert.sh" "$f"
              break
            fi
          done
          repo sync -j16

      - name: Drop sync metadata
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TWRP_TOP/.repo" \
            "$GITHUB_WORKSPACE/ci-gitconfig"
          df -h "$GITHUB_WORKSPACE"
          free -h

      - name: Check compilation capacity
        shell: bash
        run: |
          set -euo pipefail
          available_kib="$(df -Pk "$GITHUB_WORKSPACE" | awk 'NR == 2 { print $4 }')"
          required_kib=$((REQUIRED_COMPILE_DISK_GIB * 1024 * 1024))
          if [[ -z "${available_kib}" || "${available_kib}" -lt "${required_kib}" ]]; then
            echo "::error::删除 .repo 后需要至少 ${REQUIRED_COMPILE_DISK_GIB} GiB (实测 $((available_kib / 1024 / 1024)) GiB)。"
            exit 1
          fi
          du -sh "$TWRP_TOP"
          df -h "$GITHUB_WORKSPACE"

      - name: Building TWRP
        # 关键: 步骤级超时要远小于 job 的 6h 上限。若任由 GitHub 在 360 分钟
        # 平台强杀整个 job, 后面的 ccache 保存步骤不会执行, 缓存永远建立不起来,
        # 每次运行都从零冷编译 => 每次都在第 6 小时被杀 (exit 143) 死循环。
        # 步骤超时是"优雅失败", always() 的保存步骤仍会执行。
        timeout-minutes: 250
        shell: bash
        working-directory: ${{ env.TWRP_TOP }}
        env:
          ALLOW_MISSING_DEPENDENCIES: 'true'
          GOMEMLIMIT: '3GiB'
          GOGC: '20'
          _JAVA_OPTIONS: '-Xmx3g'
          USE_CCACHE: '1'
          CCACHE_EXEC: /usr/bin/ccache
          CCACHE_COMPILERCHECK: content
          CCACHE_COMPRESS: 'true'
        run: |
          set -euo pipefail
          build_jobs="$(nproc)"
          export NINJA_ARGS="-j${build_jobs} -l${build_jobs}"
          printf 'Using %s Ninja jobs\n' "$build_jobs"

          (
            while sleep 60; do
              date -u '+%Y-%m-%dT%H:%M:%SZ build heartbeat'
              df -h "$GITHUB_WORKSPACE"
              free -h
            done
          ) &
          heartbeat_pid=$!
          trap 'kill "$heartbeat_pid" 2>/dev/null || true' EXIT

          set +u
          source build/envsetup.sh
          lunch ${{ github.event.inputs.MAKEFILE_NAME }}

          # 逐个目标分别构建, 不用一条 `make A B -j`。
          # 合并构建时并行输出会互相淹没, 定位不到是哪个目标失败; 分开后
          # 每个目标有独立日志, 便于定位失败目标。
          build_target_log="$GITHUB_WORKSPACE/twrp-build.log"
          : > "$build_target_log"

          for target in ${{ github.event.inputs.BUILD_TARGET }}; do
            echo "===== BUILD TARGET: $target =====" | tee -a "$build_target_log"
            if make "$target" -j"$build_jobs" 2>&1 | tee -a "$build_target_log"; then
              echo "===== TARGET OK: $target =====" | tee -a "$build_target_log"
            else
              echo "===== TARGET FAILED: $target =====" | tee -a "$build_target_log"
              echo "::error::构建目标 $target 失败, 详见上方日志中的 TARGET FAILED 段落"
              kill "$heartbeat_pid" 2>/dev/null || true
              trap - EXIT
              exit 1
            fi
          done

          kill "$heartbeat_pid" 2>/dev/null || true
          trap - EXIT

      - name: Verify recovery payload
        shell: bash
        run: |
          set -euo pipefail
          # 本步骤只对会产出 recovery ramdisk 的目标有意义。
          if [[ "${{ github.event.inputs.BUILD_TARGET }}" != *recoveryimage* ]] &&
             [[ "${{ github.event.inputs.BUILD_TARGET }}" != *vendorbootimage* ]]; then
            echo "BUILD_TARGET 不含 recoveryimage / vendorbootimage, 跳过 ramdisk 载荷自检"
            exit 0
          fi

          device_dir="$TWRP_TOP/${{ github.event.inputs.DEVICE_PATH }}"
          product="$TWRP_TOP/out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
          root="$product/recovery/root"

          if [[ ! -d "$root" ]]; then
            echo "::error::未生成 recovery root: $root"
            exit 1
          fi

          echo "::group::ramdisk 载荷自检"

          # prebuilt/recovery_modules 仅部分设备树提供; 没有则跳过模块比对,
          # 只做基础存在性校验。
          essential_list="$device_dir/prebuilt/recovery_modules/essential_modules.txt"
          shopt -s nullglob
          if [[ -f "$essential_list" ]]; then
            prebuilt_modules=()
            while IFS= read -r mod || [[ -n "$mod" ]]; do
              [[ -n "$mod" ]] || continue
              prebuilt_modules+=("$device_dir/prebuilt/recovery_modules/$mod")
            done < "$essential_list"
          else
            prebuilt_modules=("$device_dir"/prebuilt/recovery_modules/*.ko)
          fi
          shopt -u nullglob

          if [[ "${#prebuilt_modules[@]}" -gt 0 ]]; then
            missing=()
            for module in "${prebuilt_modules[@]}"; do
              if [[ ! -f "$root/lib/modules/$(basename "$module")" ]]; then
                missing+=("$(basename "$module")")
              fi
            done
            if [[ "${#missing[@]}" -gt 0 ]]; then
              echo "::error::ramdisk 缺少 ${#missing[@]}/${#prebuilt_modules[@]} 个 essential 模块, 例: ${missing[*]:0:5}"
              exit 1
            fi
            echo "内核模块: ${#prebuilt_modules[@]} 个 essential 模块全部就位"
          else
            echo "设备树未提供 prebuilt/recovery_modules, 跳过逐模块比对"
          fi

          if [[ -f "$root/ramdisk-files.txt" ]]; then
            echo "ramdisk 清单: $(wc -l < "$root/ramdisk-files.txt") 条"
          fi

          # mkbootfs 打不开目录时只打印一行就继续, ninja 视而不见。
          if [[ -f "$GITHUB_WORKSPACE/twrp-build.log" ]] && \
             grep -q 'mkbootfs: cannot open directory' "$GITHUB_WORKSPACE/twrp-build.log"; then
            echo "::warning::mkbootfs 打不开 vendor_ramdisk 目录, 相关镜像可能为空包"
          fi
          echo "::endgroup::"

          # 运行时确认构建产物 header 的绝对地址, 与静态校验互为印证。
          for img in vendor_boot.img recovery.img boot.img; do
            if [[ -f "$product/$img" ]]; then
              unpack="$TWRP_TOP/system/tools/mkbootimg/unpack_bootimg.py"
              if [[ -f "$unpack" ]]; then
                echo "::group::构建产物 $img header"
                python3 "$unpack" \
                  --boot_img "$product/$img" \
                  --out "$GITHUB_WORKSPACE/header-check" || true
                echo "::endgroup::"
              fi
              break
            fi
          done

      - name: Report compiler cache
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ccache -s
          du -sh "$CCACHE_DIR"

      - name: Collect release artifact
        shell: bash
        run: |
          set -euo pipefail
          product="$TWRP_TOP/out/target/product/${{ github.event.inputs.DEVICE_NAME }}"
          test -d "$product"
          rm -rf "$GITHUB_WORKSPACE/artifacts"
          mkdir -p "$GITHUB_WORKSPACE/artifacts"

          shopt -s nullglob
          images=("$product"/*.img "$product"/*.zip)
          shopt -u nullglob
          for image in "${images[@]}"; do
            # 剔除内部没有任何镜像的空壳 zip, 避免误刷。
            case "$image" in
              *.zip)
                if ! unzip -Z1 "$image" 2>/dev/null | grep -qE '\.img$'; then
                  echo "::warning::跳过无镜像空壳包: $(basename "$image")"
                  continue
                fi
                ;;
            esac
            cp -fp "$image" "$GITHUB_WORKSPACE/artifacts/"
          done

          if [[ -z "$(ls -A "$GITHUB_WORKSPACE/artifacts")" ]]; then
            echo "::error::没有收集到任何产物"
            ls -all "$product"
            exit 1
          fi
          (
            cd "$GITHUB_WORKSPACE/artifacts"
            sha256sum * > sha256sums.txt
          )
          cat > "$GITHUB_WORKSPACE/artifacts/build-info.md" <<EOF
          Automated TWRP build for ${{ github.event.inputs.DEVICE_NAME }}.

          - TWRP branch: ${{ github.event.inputs.MANIFEST_BRANCH }}
          - Manifest: ${{ github.event.inputs.MANIFEST_URL }}
          - Device tree: ${{ github.event.inputs.DEVICE_TREE_URL }} (${{ github.event.inputs.DEVICE_TREE_BRANCH }})
          - Lunch: ${{ github.event.inputs.MAKEFILE_NAME }}
          - Target: ${{ github.event.inputs.BUILD_TARGET }}
          - Run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}

          刷入 (A/B 设备):
              fastboot flash recovery_a <镜像> && fastboot flash recovery_b <镜像>
          EOF
          ls -all "$GITHUB_WORKSPACE/artifacts"

      - name: Save compiler cache
        if: ${{ always() && steps.ccache_restore.outputs.cache-hit != 'true' }}
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          key: twrp-ccache-${{ env.CCACHE_CACHE_VERSION }}-${{ runner.os }}-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.event.inputs.DEVICE_NAME }}

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts
          if-no-files-found: error
          retention-days: 30

      - name: Upload build diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: twrp-${{ github.event.inputs.DEVICE_NAME }}-logs-${{ github.run_id }}-${{ github.run_attempt }}
          path: twrp-build.log
          if-no-files-found: warn
          retention-days: 14

      # 自动提取失败真因, 省去在海量并行日志里人工翻找。
      - name: Diagnose build failure
        if: failure()
        shell: bash
        run: |
          set -euo pipefail
          log="$GITHUB_WORKSPACE/twrp-build.log"
          product="$TWRP_TOP/out/target/product/${{ github.event.inputs.DEVICE_NAME }}"

          echo "::group::[1/5] 各构建目标结果"
          if [[ -f "$log" ]]; then
            grep -n '^===== \(BUILD \)\?TARGET' "$log" || echo "(无 TARGET 段落)"
          else
            echo "(无构建日志)"
          fi
          echo "::endgroup::"

          echo "::group::[2/5] ninja FAILED 目标及失败命令"
          if [[ -f "$log" ]]; then
            grep -n -A 12 '^FAILED' "$log" | head -150 || echo "(未找到 FAILED 行)"
          else
            echo "(无构建日志)"
          fi
          echo "::endgroup::"

          echo "::group::[3/5] 常见错误关键字扫描"
          if [[ -f "$log" ]]; then
            grep -n -i -E 'error:|error [0-9]+|No such file or directory|No rule to make|exceed|too large|out of|undefined|not defined' \
              "$log" | head -80 || echo "(未匹配到常见错误关键字)"
          fi
          echo "::endgroup::"

          echo "::group::[4/5] out 目录产物"
          if [[ -d "$product" ]]; then
            ls -la "$product" 2>/dev/null \
              | grep -E 'vendor_boot|ramdisk|recovery|dtb|kernel' || echo "(无相关产物)"
          else
            echo "(out 目录不存在)"
          fi
          echo "::endgroup::"

          echo "::group::[5/5] 设备树 boot/vendor_boot 配置"
          bc="$TWRP_TOP/${{ github.event.inputs.DEVICE_PATH }}/BoardConfig.mk"
          if [[ -f "$bc" ]]; then
            grep -n -E 'PARTITION_SIZE|MKBOOTIMG|RAMDISK|RECOVERY|BOOT_HEADER|PREBUILT' \
              "$bc" || echo "(无匹配配置)"
          fi
          echo "::endgroup::"

      - name: Clean build worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$TWRP_TOP" \
            "$GITHUB_WORKSPACE/artifacts" \
            "$GITHUB_WORKSPACE/ci-gitconfig"

  release:
    if: ${{ needs.build.result == 'success' && github.event.inputs.PUBLISH == 'true' }}
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          name: twrp-${{ github.event.inputs.DEVICE_NAME }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-artifacts

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-artifacts/*
          name: TWRP-${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
          tag_name: twrp-${{ github.event.inputs.DEVICE_NAME }}-${{ github.event.inputs.MANIFEST_BRANCH }}-${{ github.run_id }}
          prerelease: true
          body_path: release-artifacts/build-info.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

     
